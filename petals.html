<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rose Petals</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #211713;
    }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100svh;
      background: #4c3429 url("assets/walnut-grain.webp") center / cover no-repeat;
      color: #fff3db;
    }

    .card.portrait {
      width: min(100%, 56.25svh);
      height: auto;
      aspect-ratio: 9 / 16;
      container-type: inline-size;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card::after {
      z-index: 3;
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 100% 0%, #ffe6ad90, #f4a96329 33%, transparent 66%),
        linear-gradient(147deg, transparent 36%, #ffdc9936 46%, #ffc98516 55%, transparent 67%),
        radial-gradient(ellipse at 58% 44%, transparent 30%, #27121b64 100%),
        linear-gradient(225deg, transparent 37%, #28121a66 100%);
    }

    h1 {
      z-index: 1;
      position: relative;
      margin: 1rem;
      font: italic 400 clamp(3rem, 10vw, 7rem) Georgia, serif;
      text-align: center;
      text-shadow: -3px 5px 18px #241017, -1px 2px 4px #251710;
    }

    .portrait h1 {
      font-size: clamp(2rem, 12cqw, 7rem);
    }

    button {
      position: absolute;
      z-index: 4;
      right: 1rem;
      bottom: 1rem;
      padding: .65rem 1rem;
      border: 1px solid #b87b8a;
      border-radius: 2rem;
      background: #fffaf1;
      color: #642b40;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <canvas aria-hidden="true"></canvas>
    <h1>Rose Petals</h1>
    <button type="button" disabled>Pause motion</button>
  </main>

  <script>
    const card = document.querySelector('.card');
    const background = new URLSearchParams(location.search).get('background');
    if (background && URL.canParse(background, location.href)) {
      const url = new URL(background, location.href);
      const assets = new URL('assets/', location.href);
      const bundledImage = url.origin === assets.origin &&
        url.pathname.startsWith(assets.pathname) &&
        /\.(webp|png|jpe?g|avif)$/i.test(url.pathname);
      const localImage = url.protocol === 'blob:' && url.origin === location.origin;
      if (bundledImage || localImage) {
        card.classList.add('portrait');
        card.style.backgroundImage = `url(${JSON.stringify(url.href)})`;
      }
    }

    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    const button = document.querySelector('button');
    const petalFiles = [
      'rose-petal.webp',
      'rose-petal-tapered.webp',
      'rose-petal-heart.webp',
      'rose-petal-folded.webp',
      'rose-petal-scalloped.webp',
      'rose-petal-twisted.webp'
    ];
    const leafFiles = [
      'green-leaf-light.webp',
      'green-leaf-medium.webp',
      'green-leaf-dark.webp'
    ];
    const redLighting = ['brightness(80%)', 'none', 'brightness(120%)'];
    const whiteLighting = [184, 191, 198].map(
      level => `grayscale(100%) contrast(24%) brightness(${level}%) sepia(28%)`
    );
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const random = (min, max) => min + Math.random() * (max - min);

    const opacity = .3;
    let particles = [];
    let width, height, previousTime, frame;
    let paused = reducedMotion.matches;

    function makeParticle(sprites) {
      return {
        x: random(0, width),
        y: random(0, height),
        size: random(20, 48),
        speed: random(15, 34),
        phase: random(0, Math.PI * 2),
        angle: random(0, Math.PI * 2),
        spin: random(-.45, .45),
        sway: random(8, 24),
        sprite: sprites[Math.floor(random(0, sprites.length))]
      };
    }

    function resize() {
      const oldWidth = width || canvas.clientWidth;
      const oldHeight = height || canvas.clientHeight;
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      const scale = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      context.setTransform(scale, 0, 0, scale, 0, 0);
      for (const particle of particles) {
        particle.x *= width / (oldWidth || 1);
        particle.y *= height / (oldHeight || 1);
      }
      draw();
    }

    function draw() {
      context.clearRect(0, 0, width, height);
      context.globalAlpha = opacity;
      for (const particle of particles) {
        const half = particle.size / 2;
        context.save();
        context.translate(particle.x, particle.y);
        context.rotate(particle.angle);
        context.scale(.35 + .65 * Math.abs(Math.cos(particle.phase)), 1);
        context.drawImage(particle.sprite, -half, -half, particle.size, particle.size);
        context.restore();
      }
    }

    function animate(time) {
      const elapsed = previousTime === undefined ? 0 : Math.min((time - previousTime) / 1000, .05);
      previousTime = time;

      for (const particle of particles) {
        particle.phase += elapsed * 1.3;
        particle.angle += elapsed * particle.spin;
        particle.x += Math.sin(particle.phase) * particle.sway * elapsed;
        particle.y += particle.speed * elapsed;
        const margin = particle.size;
        if (particle.x < -margin) particle.x = width + margin;
        if (particle.x > width + margin) particle.x = -margin;
        if (particle.y > height + margin) {
          particle.y = -margin;
          particle.x = random(0, width);
        }
      }

      draw();
      frame = requestAnimationFrame(animate);
    }

    function updatePlayback() {
      cancelAnimationFrame(frame);
      previousTime = undefined;
      button.textContent = paused ? 'Play motion' : 'Pause motion';
      if (!paused) frame = requestAnimationFrame(animate);
    }

    function loadSprite(file) {
      return new Promise((resolve, reject) => {
        const sprite = new Image();
        sprite.onload = () => resolve(sprite);
        sprite.onerror = reject;
        sprite.src = 'assets/' + file;
      });
    }

    Promise.all([
      Promise.all(petalFiles.map(loadSprite)),
      Promise.all(leafFiles.map(loadSprite))
    ]).then(([petalSprites, leaves]) => {
      // Prepare the lighting variations once, keeping each petal cutout.
      const petalPalettes = [redLighting, whiteLighting].map(lighting =>
        petalSprites.flatMap(sprite => lighting.map(filter => {
          const variant = document.createElement('canvas');
          variant.width = sprite.naturalWidth;
          variant.height = sprite.naturalHeight;
          const variantContext = variant.getContext('2d');
          variantContext.filter = filter;
          variantContext.drawImage(sprite, 0, 0);
          return variant;
        }))
      );
      resize();
      particles = [
        ...Array.from({ length: 10 }, () => makeParticle(petalPalettes[0])),
        ...Array.from({ length: 10 }, () => makeParticle(petalPalettes[1])),
        ...Array.from({ length: 2 }, () => makeParticle(leaves))
      ];
      draw();
      addEventListener('resize', resize);
      button.disabled = false;
      button.addEventListener('click', () => {
        paused = !paused;
        updatePlayback();
      });
      reducedMotion.addEventListener('change', event => {
        paused = event.matches;
        updatePlayback();
      });
      updatePlayback();
    }).catch(() => {
      button.textContent = 'Animation image unavailable';
    });
  </script>
</body>
</html>
