<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rose Petals</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 35%, #fffaf1, #f2dbd5);
      color: #642b40;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    h1 {
      position: relative;
      margin: 1rem;
      font: italic 400 clamp(3rem, 10vw, 7rem) Georgia, serif;
      text-align: center;
    }

    button {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      padding: .65rem 1rem;
      border: 1px solid #b87b8a;
      border-radius: 2rem;
      background: #fffaf1;
      color: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>
  <h1>Rose Petals</h1>
  <button type="button" disabled>Pause petals</button>

  <script>
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    const button = document.querySelector('button');
    const petalFiles = [
      'rose-petal.webp',
      'rose-petal-tapered.webp',
      'rose-petal-heart.webp',
      'rose-petal-folded.webp',
      'rose-petal-scalloped.webp',
      'rose-petal-twisted.webp'
    ];
    const leafFiles = [
      'green-leaf-light.webp',
      'green-leaf-medium.webp',
      'green-leaf-dark.webp'
    ];
    const redLighting = ['brightness(80%)', 'none', 'brightness(120%)'];
    const whiteLighting = [145, 155, 165].map(
      level => `grayscale(100%) contrast(45%) brightness(${level}%)`
    );
    let petalPalettes;
    let leafSprites;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const random = (min, max) => min + Math.random() * (max - min);

    // Adjust these values to change the density, size and fall speed.
    const settings = {
      density: 50,
      maxPetals: 32,
      leafCount: 50,
      minSize: 16,
      maxSize: 55,
      minSpeed: 20,
      maxSpeed: 65
    };

    let width, height, previousTime, frame;
    let particles = [];
    let paused = reducedMotion.matches;

    function makeParticle(sprites, scatter) {
      const size = random(settings.minSize, settings.maxSize);
      return {
        x: random(-size, width + size),
        y: scatter ? random(0, height) : random(-height * .3 - size, -size),
        size,
        speed: random(settings.minSpeed, settings.maxSpeed),
        phase: random(0, 2 * Math.PI),
        flutter: random(.8, 2),
        sway: random(12, 40),
        angle: random(0, 2 * Math.PI),
        spin: random(-.8, .8),
        sprites,
        sprite: sprites[Math.floor(random(0, sprites.length))]
      };
    }

    function resize() {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      const scale = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      context.setTransform(scale, 0, 0, scale, 0, 0);

      const baseCount = Math.min(settings.maxPetals, Math.max(9, Math.round(width / 42)));
      const count = baseCount * settings.density;
      particles = [
        ...Array.from({ length: count }, (_, index) =>
          makeParticle(petalPalettes[index % petalPalettes.length], true)
        ),
        ...Array.from({ length: settings.leafCount }, () => makeParticle(leafSprites, true))
      ];
      draw();
    }

    function draw() {
      context.clearRect(0, 0, width, height);
      for (const particle of particles) {
        context.save();
        context.translate(particle.x, particle.y);
        context.rotate(particle.angle + Math.sin(particle.phase) * .3);
        // Narrow the silhouette as the petal turns edge-on.
        context.scale(.16 + .84 * Math.abs(Math.cos(particle.phase)), 1);
        context.drawImage(particle.sprite, -particle.size / 2, -particle.size / 2, particle.size, particle.size);
        context.restore();
      }
    }

    function animate(time) {
      const elapsed = previousTime === undefined ? 0 : Math.min((time - previousTime) / 1000, .05);
      previousTime = time;
      const breeze = Math.sin(time / 2600) * 12;

      for (let index = 0; index < particles.length; index++) {
        const particle = particles[index];
        particle.phase += particle.flutter * elapsed;
        particle.angle += particle.spin * elapsed;
        particle.x += (Math.sin(particle.phase) * particle.sway + breeze) * elapsed;
        particle.y += particle.speed * (1 + Math.cos(particle.phase) * .22) * elapsed;

        if (particle.x < -particle.size) particle.x = width + particle.size;
        if (particle.x > width + particle.size) particle.x = -particle.size;
        if (particle.y > height + particle.size) {
          particles[index] = makeParticle(particle.sprites, false);
        }
      }

      draw();
      frame = requestAnimationFrame(animate);
    }

    function updatePlayback() {
      cancelAnimationFrame(frame);
      previousTime = undefined;
      button.textContent = paused ? 'Play petals' : 'Pause petals';
      if (!paused) frame = requestAnimationFrame(animate);
    }

    function loadSprite(file) {
      return new Promise((resolve, reject) => {
        const sprite = new Image();
        sprite.onload = () => resolve(sprite);
        sprite.onerror = reject;
        sprite.src = 'assets/' + file;
      });
    }

    Promise.all([
      Promise.all(petalFiles.map(loadSprite)),
      Promise.all(leafFiles.map(loadSprite))
    ]).then(([petalSprites, leaves]) => {
      leafSprites = leaves;
      // Prepare the lighting variations once, keeping each petal cutout.
      petalPalettes = [redLighting, whiteLighting].map(lighting =>
        petalSprites.flatMap(sprite => lighting.map(filter => {
          const variant = document.createElement('canvas');
          variant.width = sprite.naturalWidth;
          variant.height = sprite.naturalHeight;
          const variantContext = variant.getContext('2d');
          variantContext.filter = filter;
          variantContext.drawImage(sprite, 0, 0);
          return variant;
        }))
      );
      resize();
      addEventListener('resize', resize);
      button.disabled = false;
      button.addEventListener('click', () => {
        paused = !paused;
        updatePlayback();
      });
      reducedMotion.addEventListener('change', event => {
        paused = event.matches;
        updatePlayback();
      });
      updatePlayback();
    }).catch(() => {
      button.textContent = 'Animation image unavailable';
    });
  </script>
</body>
</html>
