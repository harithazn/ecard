<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rose Petals</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #4c3429 url("assets/walnut-grain.webp") center / cover no-repeat;
      color: #fff3db;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    canvas:not(#foreground) {
      filter: blur(clamp(2px, .48vw, 5px));
      transform: scale(1.015);
    }

    #foreground {
      z-index: 2;
      filter: blur(clamp(5px, .85vw, 12px));
      transform: scale(1.035);
    }

    #foreground.opening {
      background: #a64354 url("assets/rose-petal.webp") center / 270vmax no-repeat;
    }

    @media (prefers-reduced-motion: reduce) {
      #foreground.opening { background: none; }
    }

    body::after {
      z-index: 3;
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 100% 0%, #ffe6ad90, #f4a96329 33%, transparent 66%),
        linear-gradient(147deg, transparent 36%, #ffdc9936 46%, #ffc98516 55%, transparent 67%),
        radial-gradient(ellipse at 58% 44%, transparent 30%, #27121b64 100%),
        linear-gradient(225deg, transparent 37%, #28121a66 100%);
    }

    h1 {
      z-index: 1;
      position: relative;
      margin: 1rem;
      font: italic 400 clamp(3rem, 10vw, 7rem) Georgia, serif;
      text-align: center;
      text-shadow: -3px 5px 18px #241017, -1px 2px 4px #251710;
    }

    button {
      position: fixed;
      z-index: 4;
      right: 1rem;
      bottom: 1rem;
      padding: .65rem 1rem;
      border: 1px solid #b87b8a;
      border-radius: 2rem;
      background: #fffaf1;
      color: #642b40;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>
  <h1>Rose Petals</h1>
  <canvas id="foreground" class="opening" aria-hidden="true"></canvas>
  <button type="button" disabled>Pause fall</button>

  <script>
    const canvas = document.querySelector('canvas');
    const context = canvas.getContext('2d');
    const foreground = document.querySelector('#foreground');
    const foregroundContext = foreground.getContext('2d');
    const pile = document.createElement('canvas');
    const pileContext = pile.getContext('2d');
    const title = document.querySelector('h1');
    const button = document.querySelector('button');
    const petalFiles = [
      'rose-petal.webp',
      'rose-petal-tapered.webp',
      'rose-petal-heart.webp',
      'rose-petal-folded.webp',
      'rose-petal-scalloped.webp',
      'rose-petal-twisted.webp'
    ];
    const leafFiles = [
      'green-leaf-light.webp',
      'green-leaf-medium.webp',
      'green-leaf-dark.webp'
    ];
    const redLighting = ['brightness(80%)', 'none', 'brightness(120%)'];
    const whiteLighting = [184, 191, 198].map(
      level => `grayscale(100%) contrast(24%) brightness(${level}%) sepia(28%)`
    );
    let petalPalettes;
    let leafSprites;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const random = (min, max) => min + Math.random() * (max - min);

    // Adjust these values to change how many petals and leaves land.
    const settings = {
      density: 50,
      maxPetals: 32,
      leafCount: 50
    };

    let width, height, previousTime, frame, heading;
    let elapsed = 0;
    let falling = [];
    let paused = false;

    function drawSprite(target, particle, x, y, angle, turn, size = particle.size) {
      target.save();
      target.translate(x, y);
      target.rotate(angle);
      target.scale(turn, 1);
      const shadow = Math.min(28, size * .09) * canvas.width / width;
      target.shadowColor = 'rgba(30, 13, 8, .45)';
      target.shadowBlur = shadow;
      target.shadowOffsetX = -shadow * .65;
      target.shadowOffsetY = shadow * .8;
      target.drawImage(particle.sprite, -size / 2, -size / 2, size, size);
      target.restore();
    }

    function fillScene(settled = reducedMotion.matches) {
      cancelAnimationFrame(frame);
      frame = undefined;
      elapsed = 0;
      previousTime = undefined;
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      const scale = Math.min(devicePixelRatio || 1, 2);
      canvas.width = foreground.width = pile.width = Math.round(width * scale);
      canvas.height = foreground.height = pile.height = Math.round(height * scale);

      heading = title.getBoundingClientRect();
      context.setTransform(scale, 0, 0, scale, 0, 0);
      foregroundContext.setTransform(scale, 0, 0, scale, 0, 0);
      pileContext.setTransform(scale, 0, 0, scale, 0, 0);

      const baseCount = Math.min(settings.maxPetals, Math.max(9, Math.round(width / 42)));
      const petalCount = baseCount * settings.density;
      const total = petalCount + settings.leafCount;
      const cell = Math.sqrt(width * height / (total * 1.25));
      const columns = Math.max(1, Math.ceil(width / cell));
      const rows = Math.max(1, Math.ceil(height / cell));
      const spots = [];

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const x = (column + random(.05, .95)) * width / columns;
          const y = (row + random(.05, .95)) * height / rows;
          const size = random(1.8, 3) * cell;
          // Vary the clearance around the lettering and keep whole silhouettes.
          const ripple = 5 * Math.sin(x / 31 + y / 23);
          const clearance = size * .71 + random(5, 22) + ripple;
          if (distanceFromTitle(x, y) > clearance) spots.push({ x, y, size });
        }
      }

      // Mix colors and leaves throughout the settled arrangement.
      for (let index = spots.length - 1; index > 0; index--) {
        const other = Math.floor(random(0, index + 1));
        [spots[index], spots[other]] = [spots[other], spots[index]];
      }

      for (let index = 0; index < total && spots.length; index++) {
        const { x, y, size } = spots[Math.floor(index * spots.length / total)];
        const leavesBefore = Math.floor(index * settings.leafCount / total);
        const isLeaf = Math.floor((index + 1) * settings.leafCount / total) > leavesBefore;
        const palette = petalPalettes[(index - leavesBefore) % 2];
        const light = (x / width + 1 - y / height) / 2;
        const shade = Math.max(0, Math.min(2, Math.floor(3 * light + random(-.65, .65))));
        const sprite = isLeaf
          ? leafSprites[Math.floor(random(0, leafSprites.length))]
          : palette[3 * Math.floor(random(0, palette.length / 3)) + shade];
        land({ x, y, size, sprite, angle: random(0, 2 * Math.PI) });
      }

      falling = settled ? [] : [{
        sprite: petalPalettes[0][1],
        x: width * .32,
        y: height - 15,
        size: Math.min(75, Math.min(width, height) * .14),
        closeSize: Math.hypot(width, height) * 2.6,
        angle: random(-.3, .3),
        delay: .85,
        duration: 6.2
      }];
      draw();
      updatePlayback();
    }

    function distanceFromTitle(x, y) {
      const dx = Math.max(heading.left - x, x - heading.right, 0);
      const dy = Math.max(heading.top - y, y - heading.bottom, 0);
      return Math.hypot(dx, dy);
    }

    function land(particle) {
      drawSprite(pileContext, particle, particle.x, particle.y, particle.angle, .95);
    }

    function draw() {
      context.clearRect(0, 0, width, height);
      context.drawImage(pile, 0, 0, width, height);
      foregroundContext.clearRect(0, 0, width, height);
      for (const particle of falling) {
        const progress = Math.max(0, (elapsed - particle.delay) / particle.duration);
        // A close pass fills the view, then the petal recedes toward the floor.
        const remaining = 1 - progress;
        const size = particle.size + (particle.closeSize - particle.size) * (1 - progress ** 2) ** 3;
        const x = particle.x + (width / 2 - particle.x) * remaining
          + width * Math.sin(progress * Math.PI) * .12;
        const startY = height * .5;
        const y = startY + (particle.y - startY) * progress ** 1.25;
        const turn = .95 - .23 * Math.sin(progress * Math.PI * 2) ** 2;
        const angle = particle.angle + remaining * .45;
        drawSprite(foregroundContext, particle, x, y, angle, turn, size);
      }
    }

    function animate(time) {
      if (previousTime !== undefined) elapsed += Math.min((time - previousTime) / 1000, .05);
      previousTime = time;
      falling = falling.filter(particle => {
        if (elapsed < particle.delay + particle.duration) return true;
        land(particle);
        return false;
      });
      draw();
      updatePlayback();
    }

    function updatePlayback() {
      button.textContent = falling.length ? (paused ? 'Resume fall' : 'Pause fall') : 'Replay fall';
      if (falling.length && !paused) frame = requestAnimationFrame(animate);
    }

    function loadSprite(file) {
      return new Promise((resolve, reject) => {
        const sprite = new Image();
        sprite.onload = () => resolve(sprite);
        sprite.onerror = reject;
        sprite.src = 'assets/' + file;
      });
    }

    Promise.all([
      Promise.all(petalFiles.map(loadSprite)),
      Promise.all(leafFiles.map(loadSprite))
    ]).then(([petalSprites, leaves]) => {
      leafSprites = leaves;
      // Prepare the lighting variations once, keeping each petal cutout.
      petalPalettes = [redLighting, whiteLighting].map(lighting =>
        petalSprites.flatMap(sprite => lighting.map(filter => {
          const variant = document.createElement('canvas');
          variant.width = sprite.naturalWidth;
          variant.height = sprite.naturalHeight;
          const variantContext = variant.getContext('2d');
          variantContext.filter = filter;
          variantContext.drawImage(sprite, 0, 0);
          return variant;
        }))
      );
      fillScene();
      foreground.classList.remove('opening');
      addEventListener('resize', () => fillScene(!falling.length || reducedMotion.matches));
      button.disabled = false;
      button.addEventListener('click', () => {
        if (!falling.length) {
          fillScene(false);
          return;
        }
        paused = !paused;
        cancelAnimationFrame(frame);
        previousTime = undefined;
        updatePlayback();
      });
      reducedMotion.addEventListener('change', event => {
        if (event.matches) {
          paused = false;
          fillScene(true);
        }
      });
    }).catch(() => {
      foreground.classList.remove('opening');
      button.textContent = 'Animation image unavailable';
    });
  </script>
</body>
</html>
