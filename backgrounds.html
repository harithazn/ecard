    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #302621;
      background: #f7f2eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(72rem, 100% - 2rem); margin: 3rem auto; }
    h1 { font: 400 clamp(2.5rem, 6vw, 4.5rem)/1.05 Georgia, serif; margin: 0 0 1.25rem; }
    h2 { font: 400 1.65rem Georgia, serif; margin: 0; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .85rem; margin: 1rem 0; }
    .option {
      display: block;
      padding: .4rem;
      text-align: left;
      background: #fffaf4;
      color: inherit;
      border: 1px solid #c7b7a5;
      border-radius: .75rem;
      cursor: pointer;
      font: inherit;
    }
    .option[aria-pressed="true"] { border-color: #783e4c; box-shadow: inset 0 0 0 2px #783e4c; }
    .option img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: .45rem; background: #e5d5c4; }
    .option span { display: block; padding: .4rem .2rem .2rem; overflow-wrap: anywhere; }
    .file-label { display: block; font-weight: 600; margin-bottom: .35rem; }
    input { max-width: 100%; }
    .preview { align-self: start; position: sticky; top: 1rem; }
    iframe { display: block; margin-top: 1rem; border: 0; border-radius: 1rem; width: 100%; height: clamp(24rem, 58vh, 37rem); background: #4c3429; }
    :focus-visible { outline: 2px solid #783e4c; outline-offset: 4px; }
    @media (max-width: 48rem) {
      .layout { grid-template-columns: 1fr; gap: 1.25rem; }
      .preview { position: static; order: -1; }
      iframe { height: clamp(18rem, 48vh, 28rem); }
    }
  </style>

      <section class="preview" aria-labelledby="preview-title">

        <iframe id="preview" title="Wedding e-card preview"></iframe>

      </section>

    const picker = document.querySelector('#images');
    const grid = document.querySelector('#backgrounds');
    const preview = document.querySelector('#preview');
    const title = document.querySelector('#preview-title');
    const openCard = document.querySelector('#open-card');
    let local = [];
    let selected;

    function choose(scene, button) {
      selected?.setAttribute('aria-pressed', 'false');
      selected = button;
      selected.setAttribute('aria-pressed', 'true');
      title.textContent = scene.name;
      const url = new URL('petals.html', location.href);
      url.searchParams.set('background', scene.url);
      openCard.href = url.href;
      preview.src = url.href;
      openCard.hidden = scene.url.startsWith('blob:');
    }

    function render(scenes, initial) {
      grid.replaceChildren();
      selected = undefined;
      for (const scene of scenes) {
        const button = document.createElement('button');
        button.className = 'option';
        button.type = 'button';
        button.setAttribute('aria-pressed', 'false');
        const image = document.createElement('img');
        image.src = scene.thumbnail || scene.url;
        image.alt = '';
        image.loading = 'lazy';
        const label = document.createElement('span');
        label.textContent = scene.name;
        button.append(image, label);
        button.addEventListener('click', () => {
          choose(scene, button);
          if (matchMedia('(max-width: 48rem)').matches) {
            title.scrollIntoView({ block: 'start' });
          }
        });
        grid.append(button);
        if (scene === initial) choose(scene, button);
      }
    }

    picker.addEventListener('change', () => {
      for (const scene of local) URL.revokeObjectURL(scene.url);
      local = Array.from(picker.files)
        .filter(file => file.type.startsWith('image/'))
        .map(file => ({
          name: file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' '),
          url: URL.createObjectURL(file)
        }));
      render([...bundled, ...local], local[0] || bundled[0]);
    });

    render(bundled, bundled[0]);
